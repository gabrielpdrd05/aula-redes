# La web se mudó a https://loopback-academia.github.io (repositorio loopback-academia/loopback-academia.github.io).
# Esta dirección antigua solo publica páginas de redirección (carpeta redireccion/), que llevan a la misma sección
# en la nueva dirección y trasladan el progreso guardado sin cuenta en el navegador.
name: Publicar redirección

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la redirección
        run: |
          mkdir _site
          cp redireccion/* _site/
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
